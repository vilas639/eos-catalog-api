server:
    port: 8081

spring:
  boot:
       admin:
            client:
              url: http://localhost:8090
              instance:
                service-base-url: http://localhost:8081
  application:
      name: eos-catalog-api-service
  config:
      import: optional:configserver:http://localhost:8888/
  profiles:
      active: uat    
  cloud:
      config:
            uri: http://localhost:8888

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true
    fetchRegistry: true
    enabled: true
  instance:
    instanceId: ${spring.application.name}:${server.port}
    hostname: localhost 
    preferIpAddress: false
management:
  endpoints:
         web:
            exposure:
                 include: "*"
  endpoint:
         health:
            show-details: always
  security:
        enabled: false
